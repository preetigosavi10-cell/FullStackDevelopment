<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mywebpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>
            Welcome to KBTCOE
        </h1>
        <p>WE BUILD FUTURE!!</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">AboutUS</a>
        <a href="#form">Registration</a>
        <a href="#contact">Contact</a>
    </nav>
<section id="home">
        <h1>Welcome!!</h1>
    </section>

    <div class="about">  

    <section id="about">
        <h1>we provide variety of courses</h1>
    </section>
</div>
    <section id="form">
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="enter full name" required>
            <br><br>

            <label for="age">Age:</label>
            <input type="int" id="age" name="age" placeholder="enter age" required>
            <br><br>

            <label for="course">Course:</label>
            <select id="course" name="course">
                <option value="">Select course</option>
                <option value="it">IT</option>
                <option value="cs">CS</option>
                <option value="ai">AI</option>
            </select>
            <br><br>

            <div class="options">

           <label for="gender">Gender</label>


           <label for="male">Male</label>
           <input type="radio" id="male" name="gender" value="male">
           
           <label for="female">Female</label>
           <input type="radio" id="female" name="gender" value="female">
           
           <label for="other">Other</label>
           <input type="radio" id="other" name="other" value="other">
           
           </div>
           <br><br>

           <label for="email">Email</label>
           <input type="email" id="email" name="email" placeholder="Enter email" required>
           <br><br>

           <label for="date">Date</label>
           <input type="date" id="date" name="date" required>
           <br><br>

              <label for="text">Text</label>
           <textarea id="text" name="text" rows="4" cols="50" placeholder="Enter text here"></textarea> 
           <br><br>

           <button type="submit">Register</button>



        </form>
       
    </section>
     
 
    <section id="contact">
        <h1>Contact Us</h1>
        <p>kbtcoe@gmail.com</p>
    </section>

    <footer>
        <p>
            @copyrights reserved.
        </p>
    </footer>

    

</body>
</html>
