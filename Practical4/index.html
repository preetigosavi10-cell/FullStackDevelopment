<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Student details</h2>
    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Enter name">

    <label for="rollno">RollNo::</label>
    <input type="number" id="rollno" placeholder="Enter rollno">

    <label for="sub1">Subject1:</label>
    <input type="number" id="sub1" placeholder="Enter sub1 marks">

    <label for  ="sub2">Subject2:</label>
    <input type="number" id="sub2" placeholder="Enter sub2 marks">

    <label for="sub3">Subject3:</label>
    <input type="number" id="sub3" placeholder="Enter sub3 marks">

    <button onclick="addStudent()">Add Student</button>

    <table id="studentrecord">
        <tr>
            <th>Name</th>
            <th>RollNo</th>
            <th>Sub1</th>
            <th>Sub2</th>
            <th>Sub3</th>
            <th>Total</th>
            <th>Percentage</th>
        </tr>
    </table>

    <h2 id="topper">Topper</h2>
    <script src="script.js"></script>
</body>
</html>
